<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090A0B">
<title>ProTextil · Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#111315;--nav:#090A0B;--card:#1A1D21;--hov:#21252a;--line:#2C3035;--ink:#F5F5F5;--mut:#A5ABB3;--g:#22C55E;--b:#3B82F6;--y:#F59E0B;--r:#EF4444;--rad:12px;--t:.18s;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;transition:grid-template-columns var(--t) ease}
.app.min{grid-template-columns:76px minmax(0,1fr)}
.app.lg{grid-template-columns:1fr}.app.lg nav{display:none}

/* ===== menu lateral ===== */
nav{background:var(--nav);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
nav .brand{padding:4px 6px 22px;display:flex;justify-content:center}
nav .brand img{width:152px;max-width:100%;display:block;border-radius:6px;transition:width var(--t)}
.min nav .brand img{width:52px}
nav .items{flex:1;display:flex;flex-direction:column;gap:4px}
nav .foot{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
nav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--mut);font:500 14.5px Inter,system-ui;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;transition:background var(--t),color var(--t),transform .1s}
nav button svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:rgba(255,255,255,.05);color:var(--ink)}
nav button.on{background:rgba(255,255,255,.09);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
nav button.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#fff}
nav button:active{transform:scale(.98)}
nav .sh{display:none}
.min nav .lb{display:none}.min nav button{justify-content:center;padding:11px 0}
.min nav .cl svg{transform:rotate(180deg)}
nav .cl svg{transition:transform var(--t)}

/* ===== conteúdo ===== */
main{padding:30px 36px 48px;max-width:1280px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:24px}
h1{font-size:26px;font-weight:700;margin:0 0 4px;letter-spacing:-.4px;line-height:1.2}
h2{font-size:15px;font-weight:600;margin:0}
.sub{color:var(--mut);margin:0}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* ===== cartões de indicadores ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:28px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:18px 20px;transition:transform var(--t),border-color var(--t),background var(--t)}
.kpi:hover{transform:translateY(-2px);border-color:#3b4048;background:var(--hov)}
.kpi .kh{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px;font-weight:500}
.kpi .ic{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--mut)}
.kpi .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpi b{display:block;font-size:30px;font-weight:700;line-height:1.15;margin:10px 0 2px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--mut);font-size:12.5px}
.kpi small.r{color:var(--r)}.kpi small.y{color:var(--y)}

/* ===== painéis, tabelas ===== */
.pn{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:20px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input{width:220px}.tools select{width:auto}
.tw{border:1px solid var(--line);border-radius:var(--rad);background:var(--card);overflow-x:auto}
.tw.in{border:0;background:none;border-radius:0}
.tw.in .tbl{min-width:760px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;padding:12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02);white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background var(--t)}
tbody tr:hover td{background:var(--hov)}
tr.late,tr.near{--ac:var(--r)}tr.near{--ac:var(--y)}
tr.late td:first-child,tr.near td:first-child{box-shadow:inset 3px 0 0 var(--ac)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td.ac{white-space:nowrap;text-align:right}
td .mu{color:var(--mut);display:block;font-size:12.5px}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:rgba(165,171,179,.14);color:var(--mut);white-space:nowrap;border:0}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.n::before{display:none}
.tag.ok{color:var(--g);background:rgba(34,197,94,.13)}.tag.info{color:var(--b);background:rgba(59,130,246,.14)}
.tag.warn{color:var(--y);background:rgba(245,158,11,.14)}.tag.bad{color:var(--r);background:rgba(239,68,68,.14)}
.chip{display:inline-block;margin-left:6px;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600}
.chip.r{color:var(--r);background:rgba(239,68,68,.14)}.chip.y{color:var(--y);background:rgba(245,158,11,.14)}
.empty{color:var(--mut);padding:28px 18px;border:1px dashed var(--line);border-radius:var(--rad);text-align:center}
td .empty{border:0;padding:20px}

/* ===== botões e campos ===== */
button.b,a.b{background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:9px;font:600 13.5px Inter,system-ui;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background var(--t),border-color var(--t),color var(--t),transform .1s,opacity var(--t)}
button.b:hover{opacity:.88}
button.b:active{transform:scale(.96)}
button.b svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.o{background:transparent;color:var(--ink);border-color:var(--line)}
button.o:hover{background:rgba(255,255,255,.06);border-color:#454b53;opacity:1}
button.o.d:hover{color:var(--r);border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
button.s{padding:5px 11px;font-size:12.5px;border-radius:8px}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px;width:100%;transition:border-color var(--t),box-shadow var(--t)}
input::placeholder,textarea::placeholder{color:#6b727b}
input:hover,select:hover,textarea:hover{border-color:#454b53}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--b);box-shadow:0 0 0 3px rgba(59,130,246,.22)}
select.st{width:auto;padding:5px 28px 5px 10px;font-size:13px;border-radius:8px}
label{display:block;font-weight:500;font-size:12.5px;color:var(--mut);margin-bottom:12px}
label input,label select,label textarea{margin-top:6px;font-weight:400}
button:focus-visible,nav button:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:20px;margin-bottom:18px}
.chk{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0 12px}.chk label{font-weight:400;margin:0;display:flex;gap:7px;align-items:center;color:var(--ink)}.chk input{width:auto;accent-color:var(--b)}

/* ===== kanban / datas ===== */
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.col{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:var(--rad);padding:14px}
.col h3{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px;font-weight:600}
.col h3 i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.col h3 span{margin-left:auto;color:var(--mut);font-weight:500;font-size:12.5px;background:rgba(255,255,255,.06);border-radius:999px;padding:0 9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;transition:transform var(--t),border-color var(--t)}
.card:hover{transform:translateY(-1px);border-color:#3b4048}
.card small{color:var(--mut);display:block;margin-top:2px}
.dg{margin:26px 0 10px;display:flex;align-items:center;gap:10px}.dg h2{font-size:14px}.dg span{color:var(--mut);font-size:12.5px}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}.dl .card{margin:0}

/* ===== ficha técnica ===== */
.ft{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.sheet{background:#fff;color:#000;border:2px solid #000;padding:18px;font-size:13px;border-radius:6px;overflow-x:auto}
.sheet .hd{background:#000;padding:8px;margin:-18px -18px 14px}.sheet .hd img{height:34px;display:block}
.sheet h4{text-align:center;font-size:22px;margin:8px 0 12px;font-weight:800}.sheet p{margin:3px 0}.sheet hr{border:0;border-top:2px solid #000;margin:10px 0}
.sheet .art{display:block;max-width:100%;max-height:340px;margin:0 auto 6px}.sheet .gr{margin:6px 0;font-size:11px}.sheet .gr th,.sheet .gr td{border:1px solid #000;color:#000;padding:3px 4px;text-align:center;text-transform:none;letter-spacing:0;font-size:11px;font-weight:400}.sheet .gr th{background:#ddd;font-weight:600}
.sheet .ph{height:270px;border:1.5px dashed #000;display:flex;align-items:center;justify-content:center;color:#777;margin:0 auto 6px}
.sheet .gr tbody tr:last-child td{border-bottom:1px solid #000}.sheet tbody tr:hover td{background:none}
.ft .pn>b{display:block;font-size:13px;margin:6px 0 2px}

/* ===== login / skeleton ===== */
.lw{min-height:100vh;display:grid;place-items:center;padding:20px}
.lc{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.lc img{width:150px;display:block;margin:0 auto 22px;border-radius:6px}.lc h1{font-size:22px}
.sk{background:linear-gradient(90deg,#1A1D21 25%,#262b31 50%,#1A1D21 75%);background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
main.fx>*{animation:rise .2s ease both}
main.fx>*:nth-child(2){animation-delay:.03s}main.fx>*:nth-child(3){animation-delay:.06s}main.fx>*:nth-child(4){animation-delay:.09s}main.fx>*:nth-child(n+5){animation-delay:.12s}

/* ===== responsivo ===== */
@media(max-width:1000px){.ft{grid-template-columns:1fr}main{padding:24px 22px 40px}}
@media(max-width:820px){
 .app,.app.min{grid-template-columns:1fr}
 nav{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:20;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}
 nav .brand,nav .cl,nav .lb{display:none!important}
 nav .items{flex-direction:row;gap:2px;flex:1}nav .foot{flex-direction:row;border:0;padding:0;margin:0}
 nav button{flex-direction:column;gap:3px;padding:7px 2px;font-size:10px;justify-content:center;text-align:center;min-width:0;flex:1}
 nav .foot button{width:auto;min-width:48px}
 nav .sh{display:block;font-size:10px;line-height:1.1;white-space:nowrap}
 nav button.on::before{left:22%;right:22%;top:-6px;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
 main{padding:20px 14px 96px}
 h1{font-size:22px}
 .tools input{width:100%;flex:1 1 100%}.tools select{flex:1}
 .kpis{grid-template-columns:1fr 1fr;gap:12px}.kpi{padding:14px}.kpi b{font-size:24px}
}
@media(max-width:720px){
 .tw{border:0;background:none;border-radius:0;overflow:visible}.tw.in .tbl{min-width:0}
 .tbl thead{display:none}
 .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
 .tbl tr{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ac,var(--line));border-radius:var(--rad);padding:8px 14px;margin-bottom:10px}
 .tbl td{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:7px 0;border:0;text-align:right}
 .tbl td::before{content:attr(data-label);color:var(--mut);font-size:12px;text-align:left;flex:none}
 .tbl td:not([data-label])::before{display:none}
 tr.late td:first-child,tr.near td:first-child{box-shadow:none}
 .tbl tbody tr:hover td{background:none}
 .tbl td.ac{justify-content:flex-end;gap:8px;padding-top:10px}.tbl td.ac::before{display:none}
 .tbl td .empty,.tbl td[colspan]{display:block}.tbl td[colspan]::before{display:none}
}
@media(max-width:420px){.kpis{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ===== impressão da ficha ===== */
@media print{
 .sheet .gr th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 nav,.noprint,.ft>div:first-child,.top{display:none!important}
 .app{display:block}main{padding:0;max-width:none}main.fx>*{animation:none}.ft{display:block}.sheet{border:0}
 .sheet .hd,.sheet .hd img{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{background:#fff}
}

const $=s=>document.querySelector(s);
let S={orders:[],mkt:[],wa:''};
try{S.wa=localStorage.getItem('pt_wa')||''}catch(e){}
let DB=null,snap={o:{},m:{}};
async function save(){
 try{localStorage.setItem('pt_wa',S.wa||'')}catch(e){}
 const jobs=[];
 for(const [k,tb,arr] of [['o','orders',S.orders],['m','mkt',S.mkt]]){
  const ids=new Set(arr.map(x=>x.id)),ch=arr.filter(x=>snap[k][x.id]!==JSON.stringify(x));
  ch.forEach(x=>snap[k][x.id]=JSON.stringify(x));
  if(ch.length)jobs.push(DB.from(tb).upsert(ch.map(x=>({id:x.id,data:x,updated_at:new Date().toISOString()}))).then(r=>{if(r.error)ch.forEach(x=>delete snap[k][x.id]);return r}));
  const gone=Object.keys(snap[k]).filter(i=>!ids.has(i));
  gone.forEach(i=>delete snap[k][i]);
  if(gone.length)jobs.push(DB.from(tb).delete().in('id',gone));
 }
 const r=await Promise.all(jobs);
 if(r.some(x=>x.error))alert('Não foi possível salvar. Verifique a internet e tente de novo.');
}
async function load(){
 const [o,m]=await Promise.all([DB.from('orders').select('id,data'),DB.from('mkt').select('id,data')]);
 if(o.error||m.error){alert('Não foi possível carregar os dados.');return}
 S.orders=o.data.map(r=>r.data);S.mkt=m.data.map(r=>r.data);snap={o:{},m:{}};
 S.orders.forEach(x=>snap.o[x.id]=JSON.stringify(x));S.mkt.forEach(x=>snap.m[x.id]=JSON.stringify(x));
}

const SH={painel:'Painel',pedidos:'Pedidos',datas:'Datas',projetos:'Projetos',ficha:'Ficha',mkt:'Market.'};

function loginView(msg){
 $('.app').classList.add('lg');$('#nav').innerHTML='';
 $('#main').innerHTML=`<div class="lw"><div class="lc"><img src="${LOGO}" alt="ProTextil"><h1>Entrar</h1><p class="sub" style="margin-bottom:20px">Acesso da equipe ProTextil</p><label>E-mail<input id="l_e" type="email" autocomplete="username"></label><label>Senha<input id="l_p" type="password" autocomplete="current-password"></label><button class="b" data-act="login" style="width:100%;justify-content:center">Entrar</button><p class="sub" id="l_m" style="margin:12px 0 0;color:var(--r)">${msg||''}</p></div></div>`;
}
const skel=()=>`<div class="sk" style="height:32px;width:180px;margin-bottom:10px"></div><div class="sk" style="height:16px;width:250px;margin-bottom:28px"></div><div class="kpis">${'<div class="sk" style="height:118px"></div>'.repeat(4)}</div><div class="sk" style="height:300px"></div>`;
async function boot(){
 if(!window.supabase||SB_URL.startsWith('COLE')){$('#main').innerHTML='<h1>Configuração pendente</h1><p class="sub">Preencha SB_URL e SB_KEY no início do arquivo index.html.</p>';return}
 DB=DB||supabase.createClient(SB_URL,SB_KEY);
 const {data:{session}}=await DB.auth.getSession();
 if(!session)return loginView();
 nav();$('#main').innerHTML=skel();
 await load();render();fx();
}
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&DB&&!showNew&&['painel','pedidos','datas','projetos','mkt'].includes(tab)&&!(document.activeElement||{}).matches?.('input,select,textarea')){await load();render()}});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>d?d.split('-').reverse().join('/'):'—';
const $$=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const ST=['A fazer','Em produção','Pronto','Entregue'],PL=['Shopee','Mercado Livre','Amazon'],MS=['Rascunho','Publicado','Pausado'];
const TABS=[['painel','Painel'],['pedidos','Pedidos'],['datas','Data do pedido'],['projetos','Projetos a fazer'],['ficha','Ficha técnica'],['mkt','Marketplace']];
const SZ=['P','M','G','GG'],BB=['PB','MB','GB','GGB'];
let tab='painel',sel=null,showNew=false,pq='',pf='',oq='',ofl='';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const ord=id=>S.orders.find(o=>o.id===id);
const tot=f=>['A','B','I'].reduce((a,p)=>a+gt(f,p),0);
const stCls={'A fazer':'','Em produção':'info','Pronto':'ok','Entregue':'ok'};
const stTag=s=>`<span class="tag ${stCls[s]||''}">${esc(s)}</span>`;
const stDot={'A fazer':'var(--mut)','Em produção':'var(--b)','Pronto':'var(--g)'};
/* prazo: dias até a entrega (negativo = atrasado); null se não houver prazo ou já entregue */
const dl=o=>(!o.entrega||o.status==='Entregue')?null:Math.round((new Date(o.entrega+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const dChip=o=>{const d=dl(o);if(d===null)return'';if(d<0)return`<span class="chip r">Atrasado ${-d}d</span>`;if(d===0)return'<span class="chip y">Hoje</span>';if(d<=3)return`<span class="chip y">${d===1?'Amanhã':'Em '+d+' dias'}</span>`;return''};
const rowCls=o=>{const d=dl(o);return d===null?'':d<0?'late':d<=3?'near':''};
const flt=(l,q,st)=>{q=(q||'').trim().toLowerCase();return l.filter(o=>(!st||o.status===st)&&(!q||((o.cliente||'')+' '+(o.produto||'')).toLowerCase().includes(q)))};
const stOpts=(list,cur)=>`<option value="">Todos os status</option>`+list.map(s=>`<option ${s===cur?'selected':''}>${s}</option>`).join('');

/* ---------- navegação ---------- */
const coll=()=>{try{return localStorage.getItem('pt_nav')==='1'}catch(e){return false}};
function nav(){
 $('.app').classList.remove('lg');$('.app').classList.toggle('min',coll());
 $('#nav').innerHTML=`<div class="brand"><img src="${LOGO}" alt="ProTextil"></div><div class="items">${TABS.map(t=>`<button data-go="${t[0]}" class="${tab===t[0]?'on':''}" title="${t[1]}">${IC[t[0]]}<span class="lb">${t[1]}</span><span class="sh">${SH[t[0]]}</span></button>`).join('')}</div><div class="foot"><button data-act="collapse" class="cl" title="Recolher ou expandir menu">${IC.col}<span class="lb">Recolher menu</span></button><button data-act="logout" title="Sair">${IC.out}<span class="lb">Sair</span><span class="sh">Sair</span></button></div>`}

/* ---------- painel ---------- */
function pRows(){
 const l=flt([...S.orders].filter(o=>o.status!=='Entregue'&&o.entrega).sort((a,b)=>a.entrega.localeCompare(b.entrega)),pq,pf);
 const lim=(pq.trim()||pf)?50:6,v=l.slice(0,lim);
 return v.length?v.map(o=>`<tr class="${rowCls(o)}"><td data-label="Cliente"><b>${esc(o.cliente)}</b></td><td data-label="Produto">${esc(o.produto)}</td><td data-label="Entrega" class="num"><span>${fd(o.entrega)}${dChip(o)}</span></td><td data-label="Status">${stTag(o.status)}</td><td class="ac"><button class="b o s" data-ficha="${o.id}">Ficha</button> <button class="b s" data-adv="${o.id}">${o.status==='Pronto'?'Entregue':'Avançar'}</button></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">${(pq.trim()||pf)?'Nenhuma entrega encontrada com esse filtro.':'Nenhum pedido com data de entrega. Cadastre o primeiro em Pedidos.'}</div></td></tr>`}
function painel(){
 const ab=S.orders.filter(o=>o.status!=='Entregue'),sem=ab.filter(o=>o.entrega&&dl(o)<=7),atr=ab.filter(o=>dl(o)<0).length;
 const af=S.orders.filter(o=>o.status==='A fazer').length,ep=S.orders.filter(o=>o.status==='Em produção').length;
 const kp=(ic,l,v,sub,cl)=>`<div class="kpi"><div class="kh"><span>${l}</span><i class="ic">${IC[ic]}</i></div><b>${v}</b><small class="${cl||''}">${sub}</small></div>`;
 return `<div class="top"><div><h1>Painel</h1><p class="sub">Visão geral da produção</p></div><div class="acts"><button class="b o" data-act="reload">${IC.refresh}Atualizar</button><button class="b" data-act="newOrder">${IC.plus}Novo pedido</button></div></div>
 <div class="kpis">${kp('pedidos','Pedidos em aberto',ab.length,`${S.orders.length} cadastrados no total`)}${kp('clock','Entregas em até 7 dias',sem.length,atr?`${atr} ${atr===1?'pedido atrasado':'pedidos atrasados'}`:'Nenhum atraso',atr?'r':'')}${kp('projetos','Projetos a fazer',af,`${ep} em produção`)}${kp('money','Valor em aberto',$$(ab.reduce((a,o)=>a+(+o.valor||0),0)),`${ab.length} ${ab.length===1?'pedido':'pedidos'} em aberto`)}</div>
 <div class="pn"><div class="ph"><h2>Próximas entregas</h2><div class="tools"><input id="p_q" type="search" placeholder="Buscar cliente ou produto" value="${esc(pq)}" aria-label="Buscar"><select id="p_f" aria-label="Filtrar por status">${stOpts(ST.slice(0,3),pf)}</select></div></div>
 <div class="tw in"><table class="tbl"><thead><tr><th>Cliente</th><th>Produto</th><th>Data de entrega</th><th>Status</th><th style="text-align:right">Ações</th></tr></thead><tbody id="p_tb">${pRows()}</tbody></table></div>
 ${ab.filter(o=>o.entrega).length>6?'<div style="margin-top:12px;text-align:right"><button class="b o s" data-go="pedidos">Ver todos os pedidos</button></div>':''}</div>`}

/* ---------- pedidos ---------- */
function oRows(){
 const rows=flt([...S.orders].sort((a,b)=>b.data.localeCompare(a.data)),oq,ofl);
 return rows.length?rows.map(o=>`<tr class="${rowCls(o)}"><td data-label="Cliente"><b>${esc(o.cliente)}</b></td><td data-label="Produto">${esc(o.produto)}</td><td data-label="Qtd" class="num">${o.qtd||'—'}</td><td data-label="Valor" class="num">${$$(o.valor)}</td><td data-label="Pedido" class="num">${fd(o.data)}</td><td data-label="Entrega" class="num"><span>${fd(o.entrega)}${dChip(o)}</span></td><td data-label="Status"><select class="st" data-st="${o.id}">${ST.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td class="ac"><button class="b o s" data-ficha="${o.id}">Ficha</button> <button class="b o s d" data-del="${o.id}" aria-label="Excluir pedido">Excluir</button></td></tr>`).join(''):`<tr><td colspan="8"><div class="empty">${S.orders.length?'Nenhum pedido encontrado com esse filtro.':'Nenhum pedido ainda. Clique em Novo pedido para começar.'}</div></td></tr>`}
function pedidos(){
 return `<div class="top"><div><h1>Pedidos</h1><p class="sub">${S.orders.length} cadastrados</p></div><button class="b ${showNew?'o':''}" data-act="toggleNew">${showNew?'Fechar':IC.plus+'Novo pedido'}</button></div>
 ${showNew?`<div class="box"><div class="g"><label>Cliente<input id="n_cli"></label><label>Produto<input id="n_prod" placeholder="Camisa DTF, banner..."></label><label>Quantidade<input id="n_qtd" type="number" min="1"></label><label>Valor (R$)<input id="n_val" type="number" step="0.01"></label><label>Data do pedido<input id="n_data" type="date" value="${today()}"></label><label>Data de entrega<input id="n_ent" type="date"></label></div><button class="b" data-act="addOrder">Salvar pedido</button></div>`:''}
 <div class="pn"><div class="ph"><h2>Todos os pedidos</h2><div class="tools"><input id="o_q" type="search" placeholder="Buscar cliente ou produto" value="${esc(oq)}" aria-label="Buscar"><select id="o_f" aria-label="Filtrar por status">${stOpts(ST,ofl)}</select></div></div>
 <div class="tw in"><table class="tbl"><thead><tr><th>Cliente</th><th>Produto</th><th>Qtd</th><th>Valor</th><th>Pedido</th><th>Entrega</th><th>Status</th><th></th></tr></thead><tbody id="o_tb">${oRows()}</tbody></table></div></div>`}

/* ---------- data do pedido ---------- */
function datas(){
 const g={};S.orders.forEach(o=>(g[o.data]=g[o.data]||[]).push(o));
 const ks=Object.keys(g).sort().reverse();
 return `<div class="top"><div><h1>Data do pedido</h1><p class="sub">Pedidos agrupados pelo dia em que entraram</p></div></div>`+(ks.length?ks.map(k=>`<div class="dg"><h2>${fd(k)}</h2><span>${g[k].length} ${g[k].length===1?'pedido':'pedidos'}</span></div><div class="dl">${g[k].map(o=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><b>${esc(o.cliente)}</b>${stTag(o.status)}</div><span style="color:var(--mut)">${esc(o.produto)}</span><small>Entrega ${fd(o.entrega)}${dChip(o)} · ${o.qtd||'—'} peças · ${$$(o.valor)}</small></div>`).join('')}</div>`).join(''):'<div class="empty">Sem pedidos para listar.</div>')}

/* ---------- projetos ---------- */
function projetos(){
 return `<div class="top"><div><h1>Projetos a fazer</h1><p class="sub">Mova cada pedido pela produção</p></div></div><div class="kan">${ST.slice(0,3).map((s,i)=>{const l=S.orders.filter(o=>o.status===s).sort((a,b)=>(a.entrega||'9').localeCompare(b.entrega||'9'));
 return `<div class="col"><h3><i style="background:${stDot[s]}"></i>${s}<span>${l.length}</span></h3>${l.length?l.map(o=>`<div class="card"><b>${esc(o.cliente)}</b><small>${esc(o.produto)} · entrega ${fd(o.entrega)}${dChip(o)}</small><div style="margin-top:10px;display:flex;gap:6px"><button class="b o s" data-ficha="${o.id}">Ficha</button><button class="b s" data-adv="${o.id}">${i<2?'Avançar':'Entregue'}</button></div></div>`).join(''):'<div class="empty">Vazio</div>'}</div>`}).join('')}</div>`}

/* ---------- marketplace ---------- */
const msCls={Rascunho:'',Publicado:'ok',Pausado:'warn'};
function mkt(){
 return `<div class="top"><div><h1>Marketplace</h1><p class="sub">Organize os produtos antes de anunciar</p></div></div>
 <div class="box"><div class="g"><label>Produto<input id="m_nome"></label><label>Plataforma<select id="m_pl">${PL.map(p=>`<option>${p}</option>`).join('')}</select></label><label>Preço (R$)<input id="m_pre" type="number" step="0.01"></label><label>Estoque<input id="m_est" type="number"></label><label>Link ou código<input id="m_ref"></label></div><button class="b" data-act="addMkt">${IC.plus}Adicionar produto</button></div>
 ${S.mkt.length?`<div class="tw"><table class="tbl"><thead><tr><th>Produto</th><th>Plataforma</th><th>Preço</th><th>Estoque</th><th>Link/código</th><th>Status</th><th></th></tr></thead><tbody>${S.mkt.map(m=>`<tr><td data-label="Produto"><b>${esc(m.nome)}</b></td><td data-label="Plataforma">${esc(m.pl)}</td><td data-label="Preço" class="num">${$$(m.pre)}</td><td data-label="Estoque" class="num">${m.est||0}</td><td data-label="Link/código">${esc(m.ref)}</td><td data-label="Status"><button class="tag ${msCls[m.st]||''}" style="cursor:pointer" data-ms="${m.id}" title="Alternar status">${m.st}</button></td><td class="ac"><button class="b o s d" data-dm="${m.id}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum produto cadastrado. Toque no status para alternar entre rascunho, publicado e pausado.</div>'}`}

/* ---------- ficha técnica (lógica original preservada) ---------- */
const GR=[['A','Grade adulto',['P','M','G','GG','EGG','EXG']],['B','Grade baby look',['PP','P','M','G','GG']],['I','Grade infantil',['2','4','6','8','10','12','14']]];
const gt=(f,p)=>GR.find(g=>g[0]===p)[2].reduce((a,k)=>a+(+((f.sz||{})[p+k])||0),0);
let IMG=null,IMGid=null;
function fichaForm(o){
 const f=o.f||{},sz=f.sz||{},c=(k,v)=>(f[k]||[]).includes(v)?'checked':'';
 const grid=g=>`<b>${g[1]}</b> <span class="tag n">${gt(f,g[0])} peças</span><div class="g" style="margin:8px 0 12px;grid-template-columns:repeat(auto-fit,minmax(68px,1fr))">${g[2].map(k=>`<label>${k}<input type="number" min="0" data-sz="${g[0]+k}" value="${sz[g[0]+k]||''}"></label>`).join('')}</div>`;
 return `<label>Pedido<select id="f_sel">${S.orders.map(x=>`<option value="${x.id}" ${x.id===o.id?'selected':''}>${esc(x.cliente)} · ${fd(x.entrega)}</option>`).join('')}</select></label>
 <label>Arte do pedido (foto ou mockup)<input id="f_img" type="file" accept="image/*"></label>
 ${GR.map(grid).join('')}
 <div class="g"><label>Cor<input id="f_cor" value="${esc(f.cor)}" placeholder="Preta, branca..."></label><label>Gola<select id="f_gola">${['','Redonda','V','Diferente'].map(v=>`<option ${v===f.gola?'selected':''}>${v}</option>`).join('')}</select></label><label>Largura da gola<select id="f_gl">${['','3,0 cm','5,0 cm','6,0 cm'].map(v=>`<option ${v===f.gl?'selected':''}>${v}</option>`).join('')}</select></label><label>Ombro a ombro<input id="f_omb" value="${esc(f.omb)}"></label></div>
 <b>Técnica</b><div class="chk">${['Sublimação','DTF'].map(v=>`<label><input type="checkbox" data-c="tc" value="${v}" ${c('tc',v)}>${v}</label>`).join('')}</div>
 <b>Tecido</b><div class="chk">${['Poliéster','Dry','PV','Algodão'].map(v=>`<label><input type="checkbox" data-c="tec" value="${v}" ${c('tec',v)}>${v}</label>`).join('')}</div>
 <label>Acabamentos<textarea id="f_acab" rows="2">${esc(f.acab)}</textarea></label>
 <b>Gastos (R$)</b><div class="g" style="margin-top:8px">${[['gs','Sublimação'],['gd','DTF'],['gt','Tecido'],['gc','Costura']].map(x=>`<label>${x[1]}<input type="number" step="0.01" data-g="${x[0]}" value="${f[x[0]]||''}"></label>`).join('')}</div>
 <label>Observações<textarea id="f_obs" rows="2">${esc(f.obs)}</textarea></label>`}

function readF(){
 const f={sz:{},tec:[],tc:[]};
 document.querySelectorAll('[data-sz]').forEach(i=>{if(+i.value)f.sz[i.dataset.sz]=+i.value});
 document.querySelectorAll('[data-g]').forEach(i=>f[i.dataset.g]=i.value);
 document.querySelectorAll('[data-c]:checked').forEach(i=>f[i.dataset.c].push(i.value));
 f.cor=$('#f_cor').value;f.gola=$('#f_gola').value;f.gl=$('#f_gl').value;f.omb=$('#f_omb').value;f.acab=$('#f_acab').value;f.obs=$('#f_obs').value;
 f.img=IMG||((ord(sel)||{}).f||{}).img||'';return f}

function sheet(o,f){
 const tb=g=>`<table class="gr"><tr><th>${g[1].toUpperCase()}</th>${g[2].map(k=>`<th>${k}</th>`).join('')}<th>TOTAL</th></tr><tr><td>QUANT.</td>${g[2].map(k=>`<td>${(f.sz||{})[g[0]+k]||''}</td>`).join('')}<td><b>${gt(f,g[0])||''}</b></td></tr></table>`;
 return `<div class="sheet"><div class="hd"><img src="${LOGO}" alt="ProTextil"></div>
 <h4>FICHA TÉCNICA</h4><p><b>CLIENTE:</b> ${esc(o.cliente)} · <b>ENTREGA:</b> ${fd(o.entrega)}</p>
 ${f.img?`<img class="art" src="${f.img}" alt="Arte do pedido">`:'<div class="ph">Espaço para imagem</div>'}
 <p style="margin-top:8px"><b>TAMANHOS</b> <span style="float:right"><b>TOTAL PEÇAS: ${tot(f)}</b></span></p>${GR.map(tb).join('')}<hr>
 <p><b>GOLA:</b> ${esc(f.gola||'—')} ${esc(f.gl||'')} · <b>OMBRO A OMBRO:</b> ${esc(f.omb||'—')} · <b>COR:</b> ${esc(f.cor||'—')}</p>
 <p><b>TÉCNICA:</b> ${(f.tc||[]).join(', ')||'—'}</p><p><b>TECIDO:</b> ${(f.tec||[]).join(', ')||'—'}</p><p><b>ACABAMENTOS:</b> ${esc(f.acab||'—')}</p>
 <hr><p><b>GASTOS</b> · Sublimação ${$$(f.gs)} · DTF ${$$(f.gd)} · Tecido ${$$(f.gt)} · Costura ${$$(f.gc)}</p>${f.obs?`<p><b>OBS:</b> ${esc(f.obs)}</p>`:''}</div>`}

function waText(o,f){
 const gl=GR.filter(g=>gt(f,g[0])).map(g=>`${g[1]}: ${g[2].filter(k=>(f.sz||{})[g[0]+k]).map(k=>`${k} ${f.sz[g[0]+k]}`).join(', ')} (${gt(f,g[0])})`).join('\n');
 return `*FICHA TÉCNICA · PROTEXTIL*\nCliente: ${o.cliente}\nEntrega: ${fd(o.entrega)}\n\n${gl||'Tamanhos: —'}\n*Total: ${tot(f)} peças*\n\nCor: ${f.cor||'—'}\nGola: ${f.gola||'—'} ${f.gl||''}\nOmbro a ombro: ${f.omb||'—'}\nTécnica: ${(f.tc||[]).join(', ')||'—'}\nTecido: ${(f.tec||[]).join(', ')||'—'}\nAcabamentos: ${f.acab||'—'}\nGastos: Sub ${$$(f.gs)} | DTF ${$$(f.gd)} | Tecido ${$$(f.gt)} | Costura ${$$(f.gc)}${f.obs?'\nObs: '+f.obs:''}`}

function ficha(){
 if(!S.orders.length)return `<div class="top"><div><h1>Ficha técnica</h1></div></div><div class="empty">Cadastre um pedido primeiro. Cada pedido ganha a sua própria ficha.</div>`;
 const o=ord(sel)||S.orders[S.orders.length-1];sel=o.id;if(IMGid!==o.id){IMG=null;IMGid=o.id}
 return `<div class="top"><div><h1>Ficha técnica</h1><p class="sub">Preencha, salve e envie ao WhatsApp</p></div></div>
 <div class="ft"><div class="pn">${fichaForm(o)}<label>WhatsApp de destino (com DDD)<input id="f_wa" value="${esc(S.wa)}" placeholder="37999999999"></label>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b" data-act="saveF">Salvar ficha</button><button class="b" data-act="sendWa">Enviar no WhatsApp</button><button class="b o" data-act="print">Imprimir ou PDF</button></div></div>
 <div id="prev">${sheet(o,o.f||{})}</div></div>`}

/* ---------- render e eventos ---------- */
function render(){nav();$('#main').innerHTML={painel,pedidos,datas,projetos,ficha,mkt}[tab]()}
function fx(){const m=$('#main');m.classList.remove('fx');void m.offsetWidth;m.classList.add('fx')}
function go(t){tab=t;render();fx();scrollTo(0,0)}

document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.go)return go(d.go);
 if(d.ficha){sel=d.ficha;return go('ficha')}
 if(d.del){if(confirm('Excluir este pedido?')){S.orders=S.orders.filter(o=>o.id!==d.del);save();render()}return}
 if(d.adv){const o=ord(d.adv);o.status=ST[Math.min(ST.indexOf(o.status)+1,3)];save();return render()}
 if(d.ms){const m=S.mkt.find(x=>x.id===d.ms);m.st=MS[(MS.indexOf(m.st)+1)%3];save();return render()}
 if(d.dm){S.mkt=S.mkt.filter(x=>x.id!==d.dm);save();return render()}
 const a=d.act;if(!a)return;
 if(a==='toggleNew'){showNew=!showNew;render()}
 if(a==='newOrder'){showNew=true;go('pedidos')}
 if(a==='reload'){(async()=>{await load();render()})()}
 if(a==='collapse'){try{localStorage.setItem('pt_nav',coll()?'0':'1')}catch(x){}nav()}
 if(a==='login'){(async()=>{const {error}=await DB.auth.signInWithPassword({email:$('#l_e').value.trim(),password:$('#l_p').value});if(error){$('#l_m').textContent='E-mail ou senha incorretos.';return}await boot()})()}
 if(a==='logout'){(async()=>{await DB.auth.signOut();S.orders=[];S.mkt=[];loginView()})()}
 if(a==='addOrder'){const c=$('#n_cli').value.trim();if(!c){$('#n_cli').focus();return}
  S.orders.push({id:uid(),cliente:c,produto:$('#n_prod').value,qtd:+$('#n_qtd').value||0,valor:+$('#n_val').value||0,data:$('#n_data').value||today(),entrega:$('#n_ent').value,status:'A fazer',f:{}});showNew=false;save();render()}
 if(a==='addMkt'){const n=$('#m_nome').value.trim();if(!n){$('#m_nome').focus();return}
  S.mkt.push({id:uid(),nome:n,pl:$('#m_pl').value,pre:+$('#m_pre').value||0,est:+$('#m_est').value||0,ref:$('#m_ref').value,st:'Rascunho'});save();render()}
 if(a==='saveF'){ord(sel).f=readF();S.wa=$('#f_wa').value;save();t.textContent='Ficha salva';setTimeout(()=>t.textContent='Salvar ficha',1500)}
 if(a==='sendWa'){const o=ord(sel);o.f=readF();S.wa=$('#f_wa').value.replace(/\D/g,'');save();
  const n=S.wa?(S.wa.startsWith('55')?S.wa:'55'+S.wa):'';window.open(`https://wa.me/${n}?text=${encodeURIComponent(waText(o,o.f))}`,'_blank')}
 if(a==='print'){const o=ord(sel);$('#prev').innerHTML=sheet(o,readF());print()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='l_e'||e.target.id==='l_p')){const b=document.querySelector('[data-act="login"]');b&&b.click()}});
document.addEventListener('change',e=>{
 if(e.target.dataset.st){ord(e.target.dataset.st).status=e.target.value;save();render()}
 if(e.target.id==='f_sel'){sel=e.target.value;render()}
 if(e.target.id==='p_f'){pf=e.target.value;$('#p_tb').innerHTML=pRows()}
 if(e.target.id==='o_f'){ofl=e.target.value;$('#o_tb').innerHTML=oRows()}
});
document.addEventListener('input',e=>{
 if(e.target.id==='p_q'){pq=e.target.value;$('#p_tb').innerHTML=pRows();return}
 if(e.target.id==='o_q'){oq=e.target.value;$('#o_tb').innerHTML=oRows();return}
 if(tab==='ficha'&&e.target.closest('.ft>div:first-child')&&e.target.id!=='f_wa'&&e.target.id!=='f_sel')$('#prev').innerHTML=sheet(ord(sel),readF())});
document.addEventListener('change',e=>{if(e.target.id!=='f_img'||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);IMG=c.toDataURL('image/jpeg',.75);$('#prev').innerHTML=sheet(ord(sel),readF())};im.src=r.result};r.readAsDataURL(e.target.files[0])});
boot();
</script></body></html>
