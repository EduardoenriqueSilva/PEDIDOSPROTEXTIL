<style>
:root{--bg:#fff;--ink:#000;--mut:#666;--line:#d4d4d4;--pan:#f3f3f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--ink:#fff;--mut:#a0a0a0;--line:#3a3a3a;--pan:#222;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161616;--ink:#fff;--mut:#a0a0a0;--line:#3a3a3a;--pan:#222;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Archivo,system-ui,sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:#000;color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;border-right:1px solid #333}
nav img{width:150px;display:block;margin:0 auto 26px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#bbb;font:600 15px Archivo,system-ui;padding:11px 14px;border-radius:6px;cursor:pointer}
nav button:hover{color:#fff}nav button.on{background:#fff;color:#000}
main{padding:28px 32px;max-width:1150px;width:100%}
h1{font-size:30px;font-weight:800;margin:0 0 4px;letter-spacing:-.5px}h2{font-size:17px;font-weight:800;margin:26px 0 10px}
.sub{color:var(--mut);margin:0 0 22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;border:2px solid var(--ink)}
.kpi{padding:16px 18px;border-right:2px solid var(--ink)}.kpi:last-child{border:0}
.kpi b{display:block;font-size:34px;font-weight:800;line-height:1.1}.kpi span{color:var(--mut)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:600;color:var(--mut);padding:8px 10px;border-bottom:2px solid var(--ink)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
button.b,a.b{background:var(--ink);color:var(--bg);border:2px solid var(--ink);border-radius:6px;font:600 14px Archivo,system-ui;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}
button.o{background:none;color:var(--ink)}button.s{padding:4px 10px;font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--ink);border-radius:6px;padding:8px 10px;width:100%}
label{display:block;font-weight:600;font-size:13px;margin-bottom:10px}label input,label select,label textarea{margin-top:4px;font-weight:400}
:focus-visible{outline:3px solid var(--mut);outline-offset:2px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.box{border:2px solid var(--ink);padding:16px;margin-bottom:14px}
.tag{display:inline-block;border:1.5px solid var(--ink);border-radius:20px;padding:1px 10px;font-size:12px;font-weight:600}.tag.f{background:var(--ink);color:var(--bg)}
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.col h3{margin:0 0 8px;font-size:15px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.card{border:1.5px solid var(--ink);padding:10px 12px;margin-bottom:8px;background:var(--bg)}.card small{color:var(--mut);display:block}
.ft{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0 10px}.chk label{font-weight:400;margin:0;display:flex;gap:6px;align-items:center}.chk input{width:auto}
.sheet{background:#fff;color:#000;border:2px solid #000;padding:18px;font-size:13px}
.sheet .hd{background:#000;padding:8px;margin:-18px -18px 14px}.sheet .hd img{height:34px;display:block}
.sheet h4{text-align:center;font-size:22px;margin:8px 0 12px;font-weight:800}.sheet p{margin:3px 0}.sheet hr{border:0;border-top:2px solid #000;margin:10px 0}
.sheet .sz{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
.empty{color:var(--mut);padding:18px;border:1.5px dashed var(--line);text-align:center}
.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px}.top .sub{margin:0}
@media(max-width:820px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;padding:10px}nav img{display:none}nav button{white-space:nowrap;width:auto}main{padding:18px 14px}.ft{grid-template-columns:1fr}.tw{overflow-x:auto}table{min-width:620px}}
.sheet{overflow-x:auto}.sheet .art{display:block;max-width:100%;max-height:340px;margin:0 auto 6px}.sheet .gr{margin:6px 0;font-size:11px}.sheet .gr th,.sheet .gr td{border:1px solid #000;color:#000;padding:3px 4px;text-align:center}.sheet .gr th{background:#ddd}.sheet .ph{height:270px;border:1.5px dashed #000;display:flex;align-items:center;justify-content:center;color:#777;margin:0 auto 6px}
@media print{.sheet .gr th{-webkit-print-color-adjust:exact;print-color-adjust:exact}nav,.noprint,.ft>div:first-child,.top{display:none!important}.app{display:block}main{padding:0}.ft{display:block}.sheet{border:0}.sheet .hd,.sheet .hd img{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:#fff}}

const $=s=>document.querySelector(s);
let S={orders:[],mkt:[],wa:''};
try{S.wa=localStorage.getItem('pt_wa')||''}catch(e){}
let DB=null,snap={o:{},m:{}};
async function save(){
 try{localStorage.setItem('pt_wa',S.wa||'')}catch(e){}
 const jobs=[];
 for(const [k,tb,arr] of [['o','orders',S.orders],['m','mkt',S.mkt]]){
  const ids=new Set(arr.map(x=>x.id)),ch=arr.filter(x=>snap[k][x.id]!==JSON.stringify(x));
  ch.forEach(x=>snap[k][x.id]=JSON.stringify(x));
  if(ch.length)jobs.push(DB.from(tb).upsert(ch.map(x=>({id:x.id,data:x,updated_at:new Date().toISOString()}))).then(r=>{if(r.error)ch.forEach(x=>delete snap[k][x.id]);return r}));
  const gone=Object.keys(snap[k]).filter(i=>!ids.has(i));
  gone.forEach(i=>delete snap[k][i]);
  if(gone.length)jobs.push(DB.from(tb).delete().in('id',gone));
 }
 const r=await Promise.all(jobs);
 if(r.some(x=>x.error))alert('Não foi possível salvar. Verifique a internet e tente de novo.');
}
async function load(){
 const [o,m]=await Promise.all([DB.from('orders').select('id,data'),DB.from('mkt').select('id,data')]);
 if(o.error||m.error){alert('Não foi possível carregar os dados.');return}
 S.orders=o.data.map(r=>r.data);S.mkt=m.data.map(r=>r.data);snap={o:{},m:{}};
 S.orders.forEach(x=>snap.o[x.id]=JSON.stringify(x));S.mkt.forEach(x=>snap.m[x.id]=JSON.stringify(x));
}
function loginView(msg){
 $('#nav').innerHTML=`<img src="${LOGO}" alt="ProTextil">`;
 $('#main').innerHTML=`<h1>Entrar</h1><p class="sub">Acesso da equipe ProTextil</p><div class="box" style="max-width:380px"><label>E-mail<input id="l_e" type="email" autocomplete="username"></label><label>Senha<input id="l_p" type="password" autocomplete="current-password"></label><button class="b" data-act="login">Entrar</button><p class="sub" id="l_m" style="margin:10px 0 0">${msg||''}</p></div>`;
}
async function boot(){
 if(!window.supabase||SB_URL.startsWith('COLE')){$('#main').innerHTML='<h1>Configuração pendente</h1><p class="sub">Preencha SB_URL e SB_KEY no início do arquivo index.html.</p>';return}
 DB=DB||supabase.createClient(SB_URL,SB_KEY);
 const {data:{session}}=await DB.auth.getSession();
 if(!session)return loginView();
 await load();render();
}
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&DB&&!showNew&&['painel','pedidos','datas','projetos','mkt'].includes(tab)&&!(document.activeElement||{}).matches?.('input,select,textarea')){await load();render()}});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>d?d.split('-').reverse().join('/'):'—';
const $$=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today=()=>new Date().toISOString().slice(0,10);
const ST=['A fazer','Em produção','Pronto','Entregue'],PL=['Shopee','Mercado Livre','Amazon'],MS=['Rascunho','Publicado','Pausado'];
const TABS=[['painel','Painel'],['pedidos','Pedidos'],['datas','Data do pedido'],['projetos','Projetos a fazer'],['ficha','Ficha técnica'],['mkt','Marketplace']];
const SZ=['P','M','G','GG'],BB=['PB','MB','GB','GGB'];
let tab='painel',sel=null,showNew=false;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const ord=id=>S.orders.find(o=>o.id===id);
const tot=f=>['A','B','I'].reduce((a,p)=>a+gt(f,p),0);
const stTag=s=>`<span class="tag ${s==='Pronto'||s==='Entregue'?'f':''}">${s}</span>`;

function nav(){$('#nav').innerHTML=`<img src="${LOGO}" alt="ProTextil">`+TABS.map(t=>`<button data-go="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')+'<button data-act="logout" style="margin-top:18px;color:#888">Sair</button>'}

function painel(){
 const ab=S.orders.filter(o=>o.status!=='Entregue'),sem=ab.filter(o=>o.entrega&&(new Date(o.entrega)-new Date(today()))/864e5<=7);
 const prox=[...ab].filter(o=>o.entrega).sort((a,b)=>a.entrega.localeCompare(b.entrega)).slice(0,6);
 return `<h1>Painel</h1><p class="sub">Visão geral da produção</p>
 <div class="kpis"><div class="kpi"><b>${ab.length}</b><span>pedidos em aberto</span></div><div class="kpi"><b>${sem.length}</b><span>entregas em até 7 dias</span></div><div class="kpi"><b>${S.orders.filter(o=>o.status==='A fazer').length}</b><span>projetos a fazer</span></div><div class="kpi"><b>${$$(ab.reduce((a,o)=>a+(+o.valor||0),0))}</b><span>valor em aberto</span></div></div>
 <h2>Próximas entregas</h2>${prox.length?`<div class="tw"><table><tr><th>Cliente</th><th>Produto</th><th>Entrega</th><th>Status</th></tr>${prox.map(o=>`<tr><td>${esc(o.cliente)}</td><td>${esc(o.produto)}</td><td>${fd(o.entrega)}</td><td>${stTag(o.status)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhum pedido com data de entrega. Cadastre o primeiro em Pedidos.</div>'}`}

function pedidos(){
 const rows=[...S.orders].sort((a,b)=>b.data.localeCompare(a.data));
 return `<div class="top"><div><h1>Pedidos</h1><p class="sub">${S.orders.length} cadastrados</p></div><button class="b" data-act="toggleNew">${showNew?'Fechar':'Novo pedido'}</button></div>
 ${showNew?`<div class="box"><div class="g"><label>Cliente<input id="n_cli"></label><label>Produto<input id="n_prod" placeholder="Camisa DTF, banner..."></label><label>Quantidade<input id="n_qtd" type="number" min="1"></label><label>Valor (R$)<input id="n_val" type="number" step="0.01"></label><label>Data do pedido<input id="n_data" type="date" value="${today()}"></label><label>Data de entrega<input id="n_ent" type="date"></label></div><button class="b" data-act="addOrder">Salvar pedido</button></div>`:''}
 ${rows.length?`<div class="tw"><table><tr><th>Cliente</th><th>Produto</th><th>Qtd</th><th>Valor</th><th>Pedido</th><th>Entrega</th><th>Status</th><th></th></tr>${rows.map(o=>`<tr><td><b>${esc(o.cliente)}</b></td><td>${esc(o.produto)}</td><td>${o.qtd||'—'}</td><td>${$$(o.valor)}</td><td>${fd(o.data)}</td><td>${fd(o.entrega)}</td><td><select data-st="${o.id}" style="width:auto">${ST.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td style="white-space:nowrap"><button class="b o s" data-ficha="${o.id}">Ficha</button> <button class="b o s" data-del="${o.id}" aria-label="Excluir pedido">Excluir</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhum pedido ainda. Clique em Novo pedido para começar.</div>'}`}

function datas(){
 const g={};S.orders.forEach(o=>(g[o.data]=g[o.data]||[]).push(o));
 const ks=Object.keys(g).sort().reverse();
 return `<h1>Data do pedido</h1><p class="sub">Pedidos agrupados pelo dia em que entraram</p>`+(ks.length?ks.map(k=>`<h2>${fd(k)}</h2>${g[k].map(o=>`<div class="card"><b>${esc(o.cliente)}</b> · ${esc(o.produto)} ${stTag(o.status)}<small>Entrega ${fd(o.entrega)} · ${o.qtd||'—'} peças · ${$$(o.valor)}</small></div>`).join('')}`).join(''):'<div class="empty">Sem pedidos para listar.</div>')}

function projetos(){
 return `<h1>Projetos a fazer</h1><p class="sub">Mova cada pedido pela produção</p><div class="kan">${ST.slice(0,3).map((s,i)=>{const l=S.orders.filter(o=>o.status===s).sort((a,b)=>(a.entrega||'9').localeCompare(b.entrega||'9'));
 return `<div class="col"><h3>${s} (${l.length})</h3>${l.length?l.map(o=>`<div class="card"><b>${esc(o.cliente)}</b><small>${esc(o.produto)} · entrega ${fd(o.entrega)}</small><div style="margin-top:8px;display:flex;gap:6px"><button class="b o s" data-ficha="${o.id}">Ficha</button><button class="b s" data-adv="${o.id}">${i<2?'Avançar':'Entregue'}</button></div></div>`).join(''):'<div class="empty">Vazio</div>'}</div>`}).join('')}</div>`}

function mkt(){
 return `<h1>Marketplace</h1><p class="sub">Organize os produtos antes de anunciar</p>
 <div class="box"><div class="g"><label>Produto<input id="m_nome"></label><label>Plataforma<select id="m_pl">${PL.map(p=>`<option>${p}</option>`).join('')}</select></label><label>Preço (R$)<input id="m_pre" type="number" step="0.01"></label><label>Estoque<input id="m_est" type="number"></label><label>Link ou código<input id="m_ref"></label></div><button class="b" data-act="addMkt">Adicionar produto</button></div>
 ${S.mkt.length?`<div class="tw"><table><tr><th>Produto</th><th>Plataforma</th><th>Preço</th><th>Estoque</th><th>Link/código</th><th>Status</th><th></th></tr>${S.mkt.map(m=>`<tr><td><b>${esc(m.nome)}</b></td><td>${esc(m.pl)}</td><td>${$$(m.pre)}</td><td>${m.est||0}</td><td>${esc(m.ref)}</td><td><button class="b o s" data-ms="${m.id}">${m.st}</button></td><td><button class="b o s" data-dm="${m.id}">Excluir</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhum produto cadastrado. Toque no status para alternar entre rascunho, publicado e pausado.</div>'}`}

const GR=[['A','Grade adulto',['P','M','G','GG','EGG','EXG']],['B','Grade baby look',['PP','P','M','G','GG']],['I','Grade infantil',['2','4','6','8','10','12','14']]];
const gt=(f,p)=>GR.find(g=>g[0]===p)[2].reduce((a,k)=>a+(+((f.sz||{})[p+k])||0),0);
let IMG=null,IMGid=null;
function fichaForm(o){
 const f=o.f||{},sz=f.sz||{},c=(k,v)=>(f[k]||[]).includes(v)?'checked':'';
 const grid=g=>`<b>${g[1]}</b> <span class="tag">${gt(f,g[0])} peças</span><div class="g" style="margin:6px 0 12px;grid-template-columns:repeat(auto-fit,minmax(68px,1fr))">${g[2].map(k=>`<label>${k}<input type="number" min="0" data-sz="${g[0]+k}" value="${sz[g[0]+k]||''}"></label>`).join('')}</div>`;
 return `<label>Pedido<select id="f_sel">${S.orders.map(x=>`<option value="${x.id}" ${x.id===o.id?'selected':''}>${esc(x.cliente)} · ${fd(x.entrega)}</option>`).join('')}</select></label>
 <label>Arte do pedido (foto ou mockup)<input id="f_img" type="file" accept="image/*"></label>
 ${GR.map(grid).join('')}
 <div class="g"><label>Cor<input id="f_cor" value="${esc(f.cor)}" placeholder="Preta, branca..."></label><label>Gola<select id="f_gola">${['','Redonda','V','Diferente'].map(v=>`<option ${v===f.gola?'selected':''}>${v}</option>`).join('')}</select></label><label>Largura da gola<select id="f_gl">${['','3,0 cm','5,0 cm','6,0 cm'].map(v=>`<option ${v===f.gl?'selected':''}>${v}</option>`).join('')}</select></label><label>Ombro a ombro<input id="f_omb" value="${esc(f.omb)}"></label></div>
 <b>Técnica</b><div class="chk">${['Sublimação','DTF'].map(v=>`<label><input type="checkbox" data-c="tc" value="${v}" ${c('tc',v)}>${v}</label>`).join('')}</div>
 <b>Tecido</b><div class="chk">${['Poliéster','Dry','PV','Algodão'].map(v=>`<label><input type="checkbox" data-c="tec" value="${v}" ${c('tec',v)}>${v}</label>`).join('')}</div>
 <label>Acabamentos<textarea id="f_acab" rows="2">${esc(f.acab)}</textarea></label>
 <b>Gastos (R$)</b><div class="g" style="margin-top:6px">${[['gs','Sublimação'],['gd','DTF'],['gt','Tecido'],['gc','Costura']].map(x=>`<label>${x[1]}<input type="number" step="0.01" data-g="${x[0]}" value="${f[x[0]]||''}"></label>`).join('')}</div>
 <label>Observações<textarea id="f_obs" rows="2">${esc(f.obs)}</textarea></label>`}

function readF(){
 const f={sz:{},tec:[],tc:[]};
 document.querySelectorAll('[data-sz]').forEach(i=>{if(+i.value)f.sz[i.dataset.sz]=+i.value});
 document.querySelectorAll('[data-g]').forEach(i=>f[i.dataset.g]=i.value);
 document.querySelectorAll('[data-c]:checked').forEach(i=>f[i.dataset.c].push(i.value));
 f.cor=$('#f_cor').value;f.gola=$('#f_gola').value;f.gl=$('#f_gl').value;f.omb=$('#f_omb').value;f.acab=$('#f_acab').value;f.obs=$('#f_obs').value;
 f.img=IMG||((ord(sel)||{}).f||{}).img||'';return f}

function sheet(o,f){
 const tb=g=>`<table class="gr"><tr><th>${g[1].toUpperCase()}</th>${g[2].map(k=>`<th>${k}</th>`).join('')}<th>TOTAL</th></tr><tr><td>QUANT.</td>${g[2].map(k=>`<td>${(f.sz||{})[g[0]+k]||''}</td>`).join('')}<td><b>${gt(f,g[0])||''}</b></td></tr></table>`;
 return `<div class="sheet"><div class="hd"><img src="${LOGO}" alt="ProTextil"></div>
 <h4>FICHA TÉCNICA</h4><p><b>CLIENTE:</b> ${esc(o.cliente)} · <b>ENTREGA:</b> ${fd(o.entrega)}</p>
 ${f.img?`<img class="art" src="${f.img}" alt="Arte do pedido">`:'<div class="ph">Espaço para imagem</div>'}
 <p style="margin-top:8px"><b>TAMANHOS</b> <span style="float:right"><b>TOTAL PEÇAS: ${tot(f)}</b></span></p>${GR.map(tb).join('')}<hr>
 <p><b>GOLA:</b> ${esc(f.gola||'—')} ${esc(f.gl||'')} · <b>OMBRO A OMBRO:</b> ${esc(f.omb||'—')} · <b>COR:</b> ${esc(f.cor||'—')}</p>
 <p><b>TÉCNICA:</b> ${(f.tc||[]).join(', ')||'—'}</p><p><b>TECIDO:</b> ${(f.tec||[]).join(', ')||'—'}</p><p><b>ACABAMENTOS:</b> ${esc(f.acab||'—')}</p>
 <hr><p><b>GASTOS</b> · Sublimação ${$$(f.gs)} · DTF ${$$(f.gd)} · Tecido ${$$(f.gt)} · Costura ${$$(f.gc)}</p>${f.obs?`<p><b>OBS:</b> ${esc(f.obs)}</p>`:''}</div>`}

function waText(o,f){
 const gl=GR.filter(g=>gt(f,g[0])).map(g=>`${g[1]}: ${g[2].filter(k=>(f.sz||{})[g[0]+k]).map(k=>`${k} ${f.sz[g[0]+k]}`).join(', ')} (${gt(f,g[0])})`).join('\n');
 return `*FICHA TÉCNICA · PROTEXTIL*\nCliente: ${o.cliente}\nEntrega: ${fd(o.entrega)}\n\n${gl||'Tamanhos: —'}\n*Total: ${tot(f)} peças*\n\nCor: ${f.cor||'—'}\nGola: ${f.gola||'—'} ${f.gl||''}\nOmbro a ombro: ${f.omb||'—'}\nTécnica: ${(f.tc||[]).join(', ')||'—'}\nTecido: ${(f.tec||[]).join(', ')||'—'}\nAcabamentos: ${f.acab||'—'}\nGastos: Sub ${$$(f.gs)} | DTF ${$$(f.gd)} | Tecido ${$$(f.gt)} | Costura ${$$(f.gc)}${f.obs?'\nObs: '+f.obs:''}`}

function ficha(){
 if(!S.orders.length)return `<h1>Ficha técnica</h1><div class="empty">Cadastre um pedido primeiro. Cada pedido ganha a sua própria ficha.</div>`;
 const o=ord(sel)||S.orders[S.orders.length-1];sel=o.id;if(IMGid!==o.id){IMG=null;IMGid=o.id}
 return `<div class="top"><div><h1>Ficha técnica</h1><p class="sub">Preencha, salve e envie ao WhatsApp</p></div></div>
 <div class="ft"><div>${fichaForm(o)}<label>WhatsApp de destino (com DDD)<input id="f_wa" value="${esc(S.wa)}" placeholder="37999999999"></label>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b" data-act="saveF">Salvar ficha</button><button class="b" data-act="sendWa">Enviar no WhatsApp</button><button class="b o" data-act="print">Imprimir ou PDF</button></div></div>
 <div id="prev">${sheet(o,o.f||{})}</div></div>`}

function render(){nav();$('#main').innerHTML={painel,pedidos,datas,projetos,ficha,mkt}[tab]()}
function go(t){tab=t;render();scrollTo(0,0)}

document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.go)return go(d.go);
 if(d.ficha){sel=d.ficha;return go('ficha')}
 if(d.del){if(confirm('Excluir este pedido?')){S.orders=S.orders.filter(o=>o.id!==d.del);save();render()}return}
 if(d.adv){const o=ord(d.adv);o.status=ST[Math.min(ST.indexOf(o.status)+1,3)];save();return render()}
 if(d.ms){const m=S.mkt.find(x=>x.id===d.ms);m.st=MS[(MS.indexOf(m.st)+1)%3];save();return render()}
 if(d.dm){S.mkt=S.mkt.filter(x=>x.id!==d.dm);save();return render()}
 const a=d.act;if(!a)return;
 if(a==='toggleNew'){showNew=!showNew;render()}
 if(a==='login'){(async()=>{const {error}=await DB.auth.signInWithPassword({email:$('#l_e').value.trim(),password:$('#l_p').value});if(error){$('#l_m').textContent='E-mail ou senha incorretos.';return}await boot()})()}
 if(a==='logout'){(async()=>{await DB.auth.signOut();S.orders=[];S.mkt=[];loginView()})()}
 if(a==='addOrder'){const c=$('#n_cli').value.trim();if(!c){$('#n_cli').focus();return}
  S.orders.push({id:uid(),cliente:c,produto:$('#n_prod').value,qtd:+$('#n_qtd').value||0,valor:+$('#n_val').value||0,data:$('#n_data').value||today(),entrega:$('#n_ent').value,status:'A fazer',f:{}});showNew=false;save();render()}
 if(a==='addMkt'){const n=$('#m_nome').value.trim();if(!n){$('#m_nome').focus();return}
  S.mkt.push({id:uid(),nome:n,pl:$('#m_pl').value,pre:+$('#m_pre').value||0,est:+$('#m_est').value||0,ref:$('#m_ref').value,st:'Rascunho'});save();render()}
 if(a==='saveF'){ord(sel).f=readF();S.wa=$('#f_wa').value;save();t.textContent='Ficha salva';setTimeout(()=>t.textContent='Salvar ficha',1500)}
 if(a==='sendWa'){const o=ord(sel);o.f=readF();S.wa=$('#f_wa').value.replace(/\D/g,'');save();
  const n=S.wa?(S.wa.startsWith('55')?S.wa:'55'+S.wa):'';window.open(`https://wa.me/${n}?text=${encodeURIComponent(waText(o,o.f))}`,'_blank')}
 if(a==='print'){const o=ord(sel);$('#prev').innerHTML=sheet(o,readF());print()}
});
document.addEventListener('change',e=>{
 if(e.target.dataset.st){ord(e.target.dataset.st).status=e.target.value;save();render()}
 if(e.target.id==='f_sel'){sel=e.target.value;render()}
});
document.addEventListener('input',e=>{if(tab==='ficha'&&e.target.closest('.ft>div:first-child')&&e.target.id!=='f_wa'&&e.target.id!=='f_sel')$('#prev').innerHTML=sheet(ord(sel),readF())});
document.addEventListener('change',e=>{if(e.target.id!=='f_img'||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);IMG=c.toDataURL('image/jpeg',.75);$('#prev').innerHTML=sheet(ord(sel),readF())};im.src=r.result};r.readAsDataURL(e.target.files[0])});
boot();
</script></body></html>
